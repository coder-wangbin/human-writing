name: Sync Fork with Upstream

on:
  schedule:
    # 每天 UTC 2:00 自动执行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'KKKKhazix/human-writing'

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/KKKKhazix/human-writing.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_AHEAD=$(git rev-list --count HEAD..upstream/main)

          if [ "$UPSTREAM_AHEAD" -eq 0 ]; then
            echo "✅ Fork 已是最新，无需同步"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 发现上游 $UPSTREAM_AHEAD 个新 commit，开始同步..."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "count=$UPSTREAM_AHEAD" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream and push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git merge upstream/main -m "sync: 合并上游 ${{ steps.check.outputs.count }} 个 commit [skip ci]" --no-edit
          git push origin main
